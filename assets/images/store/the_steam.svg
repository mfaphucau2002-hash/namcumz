<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200">
  <defs>
    <linearGradient id="steamBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#101822"/>
      <stop offset="40%" stop-color="#171a21"/>
      <stop offset="100%" stop-color="#1b2838"/>
    </linearGradient>
    <linearGradient id="steamBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#66c0f4"/>
      <stop offset="100%" stop-color="#1999ff"/>
    </linearGradient>
    <filter id="steamGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect x="4" y="4" width="312" height="192" rx="16" fill="url(#steamBg)" stroke="#66c0f4" stroke-width="2" stroke-opacity="0.6"/>
  <!-- Decorative steam gears / lines -->
  <path d="M 20 45 L 80 45 L 110 75 L 300 75" fill="none" stroke="#66c0f4" stroke-width="1.2" stroke-opacity="0.2" stroke-dasharray="4 4"/>
  <path d="M 30 155 L 130 155 L 160 125 L 290 125" fill="none" stroke="#1999ff" stroke-width="1.2" stroke-opacity="0.2"/>
  <!-- Steam Icon -->
  <g transform="translate(68, 62) scale(0.65)" filter="url(#steamGlow)">
    <circle cx="50" cy="50" r="46" fill="none" stroke="url(#steamBlue)" stroke-width="8"/>
    <circle cx="70" cy="35" r="14" fill="url(#steamBlue)"/>
    <circle cx="70" cy="35" r="7" fill="#171a21"/>
    <circle cx="34" cy="62" r="9" fill="url(#steamBlue)"/>
    <circle cx="34" cy="62" r="4" fill="#171a21"/>
    <path d="M 62 42 L 38 58 L 44 68 L 68 52 Z" fill="url(#steamBlue)"/>
  </g>
  <!-- Brand text -->
  <text x="195" y="98" text-anchor="middle" font-family="'Orbitron', 'Chakra Petch', sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="3">STEAM</text>
  <text x="195" y="122" text-anchor="middle" font-family="'Chakra Petch', sans-serif" font-size="14" font-weight="700" fill="url(#steamBlue)" letter-spacing="5">WALLET</text>
  <!-- Security hologram pill -->
  <rect x="210" y="152" width="88" height="22" rx="11" fill="rgba(102, 192, 244, 0.15)" stroke="#66c0f4" stroke-width="1"/>
  <text x="254" y="167" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="800" fill="#66c0f4" letter-spacing="1">GLOBAL CODE</text>
</svg>