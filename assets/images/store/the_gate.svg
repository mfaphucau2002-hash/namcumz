<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200">
  <defs>
    <linearGradient id="gateBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#241202"/>
      <stop offset="50%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="gateGoldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="gateGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect x="4" y="4" width="312" height="192" rx="16" fill="url(#gateBg)" stroke="#f59e0b" stroke-width="2" stroke-opacity="0.6"/>
  <!-- Cyber circuitry -->
  <path d="M 20 40 L 80 40 L 110 70 L 300 70" fill="none" stroke="#f59e0b" stroke-width="1.2" stroke-opacity="0.25" stroke-dasharray="4 4"/>
  <path d="M 30 160 L 140 160 L 170 130 L 290 130" fill="none" stroke="#fbbf24" stroke-width="1.2" stroke-opacity="0.2"/>
  <!-- Chip icon -->
  <rect x="28" y="24" width="38" height="28" rx="6" fill="#2d1503" stroke="#f59e0b" stroke-width="1.5"/>
  <line x1="38" y1="24" x2="38" y2="52" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.5"/>
  <line x1="48" y1="24" x2="48" y2="52" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.5"/>
  <line x1="28" y1="38" x2="66" y2="38" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.5"/>
  <!-- Brand text -->
  <text x="160" y="106" text-anchor="middle" font-family="'Orbitron', 'Chakra Petch', sans-serif" font-size="44" font-weight="900" fill="url(#gateGoldGrad)" filter="url(#gateGlow)" letter-spacing="4">GATE</text>
  <!-- Subtitle -->
  <text x="160" y="132" text-anchor="middle" font-family="'Chakra Petch', sans-serif" font-size="12" font-weight="700" fill="#fde68a" letter-spacing="4">FPT GAME CARD</text>
  <!-- Security hologram pill -->
  <rect x="220" y="152" width="76" height="22" rx="11" fill="rgba(245, 158, 11, 0.15)" stroke="#f59e0b" stroke-width="1"/>
  <text x="258" y="167" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="800" fill="#fbbf24" letter-spacing="1">AUTHENTIC</text>
</svg>