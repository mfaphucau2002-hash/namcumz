<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200">
  <defs>
    <linearGradient id="zingBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091b2e"/>
      <stop offset="50%" stop-color="#0c2d4d"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="zingTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="zingDot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="zingGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect x="4" y="4" width="312" height="192" rx="16" fill="url(#zingBg)" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.6"/>
  <!-- Circuit lines -->
  <path d="M 20 50 L 100 50 L 130 80 L 290 80" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.25" stroke-dasharray="4 4"/>
  <path d="M 30 150 L 120 150 L 150 120 L 300 120" fill="none" stroke="#00f2fe" stroke-width="1.2" stroke-opacity="0.2"/>
  <!-- Chip icon -->
  <rect x="28" y="24" width="38" height="28" rx="6" fill="#0d233a" stroke="#38bdf8" stroke-width="1.5"/>
  <line x1="38" y1="24" x2="38" y2="52" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5"/>
  <line x1="48" y1="24" x2="48" y2="52" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5"/>
  <line x1="28" y1="38" x2="66" y2="38" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5"/>
  <!-- Brand text -->
  <text x="160" y="105" text-anchor="middle" font-family="'Orbitron', 'Chakra Petch', sans-serif" font-size="44" font-weight="900" fill="url(#zingTextGrad)" filter="url(#zingGlow)" letter-spacing="2">Zing</text>
  <circle cx="218" cy="74" r="7" fill="url(#zingDot)" filter="url(#zingGlow)"/>
  <!-- Subtitle -->
  <text x="160" y="132" text-anchor="middle" font-family="'Chakra Petch', sans-serif" font-size="12" font-weight="700" fill="#93c5fd" letter-spacing="4">PREPAID GAME CARD</text>
  <!-- Security hologram pill -->
  <rect x="220" y="152" width="76" height="22" rx="11" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1"/>
  <text x="258" y="167" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="800" fill="#38bdf8" letter-spacing="1">VNG CARD</text>
</svg>