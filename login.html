<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NAMCUMZ - Đăng nhập</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&family=Nunito:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/jpeg" href="/assets/images/logo.jpg">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --auth-bg: #070B15;
            --auth-card: rgba(18, 23, 36, 0.94);
            --auth-form-card: #101521;
            --auth-border: rgba(224, 194, 118, 0.20);
            --auth-gold: #E4C978;
            --auth-teal: #79D8C6;
            --auth-purple: #9A7AF2;
            --auth-text: #F7F4EA;
            --auth-text-muted: #AAB3C7;
            --auth-error: #FF6B7D;
            --font-head: 'Baloo 2', 'Nunito', 'Be Vietnam Pro', system-ui, sans-serif;
            --font-body: 'Nunito', 'Be Vietnam Pro', system-ui, sans-serif;
            --font-data: 'Be Vietnam Pro', system-ui, sans-serif;
        }

        * { box-sizing: border-box; }

        body {
            background-color: var(--auth-bg) !important;
            color: var(--auth-text) !important;
            font-family: var(--font-body) !important;
            margin: 0; padding: 0;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex; flex-direction: column;
        }

        /* Particles */
        .auth-particles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; overflow: hidden; }
        .auth-particle { position: absolute; background: #fff; border-radius: 50%; opacity: 0.15; animation: floatUp 15s infinite linear; }
        @keyframes floatUp { 0% { transform: translateY(100vh) scale(0); opacity: 0; } 50% { opacity: 0.2; } 100% { transform: translateY(-100px) scale(1); opacity: 0; } }

        /* Header */
        .auth-header-bar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 5%; width: 100%; position: absolute; top: 0; left: 0; z-index: 100;
        }
        .auth-logo {
            font-family: var(--font-head); font-size: 24px; font-weight: 700;
            background: linear-gradient(90deg, var(--auth-purple), var(--auth-teal));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-size: 200% 200%; animation: gradientMove 8s ease infinite;
            display: flex; align-items: center; gap: 10px; text-decoration: none;
        }
        @keyframes gradientMove { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        .auth-back-btn {
            color: var(--auth-text-muted); font-weight: 700; text-decoration: none; display: flex; align-items: center; gap: 8px; transition: 0.2s; font-size: 15px;
        }
        .auth-back-btn:hover { color: var(--auth-text); }

        /* Container */
        .auth-wrapper { flex: 1; display: flex; justify-content: center; align-items: center; padding: 100px 5% 40px; }
        .auth-container {
            width: 100%; max-width: 1100px; background: var(--auth-card); border: 1px solid var(--auth-border);
            border-radius: 20px; display: flex; overflow: hidden; box-shadow: 0 30px 60px rgba(0,0,0,0.4);
            position: relative;
        }

        /* Media Column (Left) */
        .auth-media-col {
            width: 46%; position: relative; overflow: hidden;
            display: flex; flex-direction: column; justify-content: flex-end;
            background: linear-gradient(45deg, #101521, #1a2235);
        }
        .auth-media-placeholder {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover;
            animation: slowZoom 12s infinite alternate ease-in-out;
            transform-origin: center center;
        }
        @keyframes slowZoom { from { transform: scale(1); } to { transform: scale(1.015); } }
        .auth-media-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to right, transparent 30%, var(--auth-card) 100%), linear-gradient(to top, rgba(7,11,21,0.9) 0%, transparent 40%);
            z-index: 1;
        }
        .auth-media-text {
            position: relative; z-index: 2; padding: 40px; color: var(--auth-text);
        }
        .auth-media-text p {
            font-size: 15px; font-weight: 500; font-family: var(--font-body); color: #D8E0ED; line-height: 1.6; margin: 0;
        }

        /* Form Column (Right) */
        .auth-form-col { width: 54%; padding: 50px; display: flex; flex-direction: column; justify-content: center; position: relative; z-index: 2; background: var(--auth-card); }
        
        /* Titles */
        .auth-title { font-family: var(--font-head); font-weight: 700; font-size: clamp(32px, 4vw, 50px); line-height: 1.1; margin-bottom: 10px; margin-top: 0; animation: fadeUpTitle 0.6s ease forwards; opacity: 0; transform: translateY(8px); }
        .auth-subtitle { font-family: var(--font-body); font-size: clamp(15px, 2vw, 17px); font-weight: 500; color: var(--auth-text-muted); margin-top: 0; margin-bottom: 30px; animation: fadeUpTitle 0.6s 0.1s ease forwards; opacity: 0; transform: translateY(8px); }
        @keyframes fadeUpTitle { to { opacity: 1; transform: translateY(0); } }

        /* Tabs Level 1 */
        .auth-tabs-l1 { display: flex; gap: 10px; margin-bottom: 30px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 15px; }
        .auth-tab-l1 { font-family: var(--font-body); font-weight: 700; font-size: 16px; color: var(--auth-text-muted); cursor: pointer; padding: 8px 16px; border-radius: 8px; transition: 0.2s; border: none; background: transparent; }
        .auth-tab-l1:hover { color: var(--auth-text); background: rgba(255,255,255,0.02); }
        .auth-tab-l1[aria-selected="true"] { color: var(--auth-teal); background: rgba(121, 216, 198, 0.1); }

        /* View Container */
        .auth-view-container { position: relative; width: 100%; }
        .auth-view { position: absolute; top: 0; left: 0; width: 100%; opacity: 0; pointer-events: none; transition: 0.25s ease; transform: translateX(10px); visibility: hidden; }
        .auth-view.active { opacity: 1; pointer-events: auto; transform: translateX(0); position: relative; visibility: visible; }

        /* Forms */
        .auth-form-card { background: var(--auth-form-card); border-radius: 16px; padding: 30px; border: 1px solid rgba(255,255,255,0.03); }
        .auth-form-title { font-family: var(--font-head); font-weight: 700; font-size: clamp(26px, 3vw, 30px); margin-top: 0; margin-bottom: 24px; color: var(--auth-text); }
        
        .input-group { margin-bottom: 20px; position: relative; }
        .input-label { display: block; font-family: var(--font-body); font-weight: 700; font-size: 14px; color: var(--auth-text-muted); margin-bottom: 8px; }
        .input-wrapper { position: relative; display: flex; align-items: center; }
        .input-icon { position: absolute; left: 16px; color: var(--auth-text-muted); font-size: 16px; pointer-events: none; }
        .auth-input { width: 100%; height: 56px; background: rgba(7, 11, 21, 0.6); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 0 45px; color: var(--auth-text); font-family: var(--font-data); font-size: 15px; font-weight: 500; transition: 0.2s; outline: none; }
        .auth-input:focus { border-color: var(--auth-teal); box-shadow: 0 0 10px rgba(121, 216, 198, 0.15); background: rgba(7, 11, 21, 0.8); }
        .toggle-password { position: absolute; right: 16px; color: var(--auth-text-muted); cursor: pointer; border: none; background: transparent; font-size: 16px; padding: 5px; }
        .toggle-password:hover { color: var(--auth-text); }
        
        .input-error { display: none; color: var(--auth-error); font-size: 13px; font-weight: 600; margin-top: 6px; font-family: var(--font-body); }
        .input-group.error .auth-input { border-color: var(--auth-error); }
        .input-group.error .input-error { display: block; }
        
        .auth-options { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; font-size: 14px; color: var(--auth-text-muted); }
        .auth-checkbox { display: flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; margin: 0; }
        .auth-checkbox input { accent-color: var(--auth-teal); width: 16px; height: 16px; cursor: pointer; }
        .auth-link { color: var(--auth-teal); text-decoration: none; font-weight: 700; transition: 0.2s; cursor: pointer; }
        .auth-link:hover { color: var(--auth-text); }

        .auth-btn { width: 100%; height: 56px; border-radius: 12px; font-family: var(--font-body); font-weight: 800; font-size: 16px; border: none; cursor: pointer; transition: all 0.2s ease; display: flex; justify-content: center; align-items: center; gap: 10px; color: #000; position: relative; overflow: hidden; letter-spacing: normal; text-transform: none; }
        .auth-btn:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(121, 216, 198, 0.2); }
        .auth-btn:active { transform: translateY(0); }
        .auth-btn:disabled { opacity: 0.7; cursor: not-allowed; transform: none; box-shadow: none; }
        .btn-login { background: linear-gradient(90deg, #79D8C6, #a1e8d9); }
        .btn-register { background: linear-gradient(90deg, #9A7AF2, #79D8C6); color: #fff; }
        .btn-google { background: #1a2235; border: 1px solid rgba(255,255,255,0.1); color: var(--auth-text); }
        .btn-google:hover { background: #232c45; border-color: rgba(255,255,255,0.2); box-shadow: none; }

        .auth-switch { text-align: center; margin-top: 20px; font-size: 15px; color: var(--auth-text-muted); font-family: var(--font-body); }

        /* Responsive */
        @media (max-width: 1024px) {
            .auth-form-col { padding: 40px 30px; }
            .auth-media-col { width: 40%; }
            .auth-form-col { width: 60%; }
        }
        @media (max-width: 768px) {
            .auth-container { flex-direction: column; max-width: 500px; margin: 0 auto; }
            .auth-media-col { width: 100%; height: 140px; flex: none; background-position: center; border-radius: 20px 20px 0 0; }
            .auth-media-text { display: none; }
            .auth-media-overlay { background: linear-gradient(to bottom, transparent, var(--auth-card)); }
            .auth-form-col { width: 100%; padding: 30px 20px; }
            .auth-header-bar { padding: 15px 20px; }
            .auth-wrapper { padding-top: 80px; padding-bottom: 20px; padding-left: 20px; padding-right: 20px; }
        }
        @media (max-width: 480px) {
            .auth-media-col { display: none; }
            .auth-container { border-radius: 16px; }
            .auth-form-card { padding: 20px; }
        }
        @media (prefers-reduced-motion: reduce) {
            * { animation: none !important; transition: none !important; }
            .auth-media-placeholder { animation: none; }
        }
    </style>
</head>
<body class="auth-page">

    <script src="assets/js/authMediaConfig.js"></script>

    <!-- Background Particles -->
    <div class="auth-particles" id="particles"></div>

    <header class="auth-header-bar">
        <a href="/" class="auth-logo">
            <img src="assets/images/logo.jpg" alt="Logo" style="width: 32px; height: 32px; border-radius: 50%; object-fit: cover;">
            NAMCUMZ
        </a>
        <a href="/" class="auth-back-btn">
            <i class="fa-solid fa-arrow-left"></i> <span class="hide-mobile">Quay lại trang chủ</span>
        </a>
    </header>

    <main class="auth-wrapper">
        <div class="auth-container">
            
            <!-- Left Media Column -->
            <div class="auth-media-col">
                <div class="auth-media-placeholder" id="authMediaBg" style="background: radial-gradient(circle at 50% 50%, #1a2235, #070B15);"></div>
                <div class="auth-media-overlay"></div>
                <div class="auth-media-text">
                    <p>Hành trình tại Teyvat trở nên nhẹ nhàng hơn cùng NAMCUMZ.</p>
                </div>
            </div>

            <!-- Right Form Column -->
            <div class="auth-form-col">
                <h1 class="auth-title">NAMCUMZ</h1>
                <p class="auth-subtitle">Chào mừng Nhà Lữ Hành trở lại</p>

                <!-- Role Tabs -->
                <div class="auth-tabs-l1" role="tablist">
                    <button class="auth-tab-l1" role="tab" aria-selected="true" id="tabCustomerBtn" onclick="switchRole('customer')">Khách hàng</button>
                    <button class="auth-tab-l1" role="tab" aria-selected="false" id="tabBoosterBtn" onclick="switchRole('booster')">Booster</button>
                </div>

                <div class="auth-view-container">
                    
                    <!-- CUSTOMER VIEWS (Login / Register) -->
                    <div id="viewCustomer" class="auth-view active">
                        
                        <!-- Login Form -->
                        <div id="formLoginWrap" class="auth-form-card">
                            <h2 class="auth-form-title">Đăng nhập</h2>
                            
                            <form id="loginForm">
                                <div class="input-group">
                                    <label class="input-label" for="username">Tên tài khoản</label>
                                    <div class="input-wrapper">
                                        <i class="fa-solid fa-user input-icon"></i>
                                        <input type="text" class="auth-input" id="username" name="username" autocomplete="username" required>
                                    </div>
                                </div>
                                <div class="input-group">
                                    <label class="input-label" for="password">Mật khẩu</label>
                                    <div class="input-wrapper">
                                        <i class="fa-solid fa-lock input-icon"></i>
                                        <input type="password" class="auth-input" id="password" name="password" autocomplete="current-password" required>
                                        <button type="button" class="toggle-password" onclick="togglePass('password', this)" tabindex="-1"><i class="fa-solid fa-eye"></i></button>
                                    </div>
                                </div>
                                <div class="auth-options">
                                    <label class="auth-checkbox">
                                        <input type="checkbox" id="rememberMe"> Ghi nhớ đăng nhập
                                    </label>
                                </div>
                                <button type="submit" class="auth-btn btn-login" id="loginBtn">
                                    Đăng nhập
                                </button>
                            </form>
                            <div class="auth-switch">
                                Chưa có tài khoản? <span class="auth-link" onclick="switchCustomerForm('register')">Tạo tài khoản</span>
                            </div>
                        </div>

                        <!-- Register Form -->
                        <div id="formRegisterWrap" class="auth-form-card" style="display: none;">
                            <h2 class="auth-form-title">Đăng ký</h2>
                            
                            <form id="registerForm">
                                <div class="input-group">
                                    <label class="input-label" for="regUsername">Tên tài khoản đăng nhập</label>
                                    <div class="input-wrapper">
                                        <i class="fa-solid fa-user input-icon"></i>
                                        <input type="text" class="auth-input" id="regUsername" name="regUsername" autocomplete="username" required>
                                    </div>
                                </div>
                                <div class="input-group">
                                    <label class="input-label" for="regDisplayName">Tên hiển thị</label>
                                    <div class="input-wrapper">
                                        <i class="fa-solid fa-id-card input-icon"></i>
                                        <input type="text" class="auth-input" id="regDisplayName" name="regDisplayName" required>
                                    </div>
                                </div>
                                <div class="input-group">
                                    <label class="input-label" for="regPassword">Mật khẩu</label>
                                    <div class="input-wrapper">
                                        <i class="fa-solid fa-lock input-icon"></i>
                                        <input type="password" class="auth-input" id="regPassword" name="regPassword" autocomplete="new-password" required>
                                        <button type="button" class="toggle-password" onclick="togglePass('regPassword', this)" tabindex="-1"><i class="fa-solid fa-eye"></i></button>
                                    </div>
                                </div>
                                <div class="input-group">
                                    <label class="input-label" for="regPasswordConfirm">Xác nhận mật khẩu</label>
                                    <div class="input-wrapper">
                                        <i class="fa-solid fa-lock input-icon"></i>
                                        <input type="password" class="auth-input" id="regPasswordConfirm" name="regPasswordConfirm" autocomplete="new-password" required>
                                        <button type="button" class="toggle-password" onclick="togglePass('regPasswordConfirm', this)" tabindex="-1"><i class="fa-solid fa-eye"></i></button>
                                    </div>
                                </div>
                                <div class="auth-options" style="margin-bottom: 20px;">
                                    <label class="auth-checkbox">
                                        <input type="checkbox" required> Đồng ý điều khoản
                                    </label>
                                </div>
                                <button type="submit" class="auth-btn btn-register" id="regSubmitBtn">
                                    Tạo tài khoản
                                </button>
                            </form>
                            <div class="auth-switch">
                                Đã có tài khoản? <span class="auth-link" onclick="switchCustomerForm('login')">Đăng nhập</span>
                            </div>
                        </div>

                    </div>

                    <!-- BOOSTER VIEW -->
                    <div id="viewBooster" class="auth-view">
                        <div class="auth-form-card">
                            <h2 class="auth-form-title">Booster Đăng Nhập</h2>
                            <p style="font-family: var(--font-body); font-size: 16px; color: var(--auth-text-muted); line-height: 1.6; margin-bottom: 30px;">
                                Đăng nhập bằng Google để nhận và quản lý các đơn cày thuê.
                            </p>
                            <button class="auth-btn btn-google" id="googleLoginBtn">
                                <svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" style="width: 24px; height: 24px;"><g><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"></path><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"></path><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"></path><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"></path><path fill="none" d="M0 0h48v48H0z"></path></g></svg>
                                Tiếp tục với Google
                            </button>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </main>

    <!-- Supabase Core First -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script>
        // Tab Role Switching
        function switchRole(role) {
            const btnCustomer = document.getElementById('tabCustomerBtn');
            const btnBooster = document.getElementById('tabBoosterBtn');
            const viewCustomer = document.getElementById('viewCustomer');
            const viewBooster = document.getElementById('viewBooster');

            if(role === 'customer') {
                btnCustomer.setAttribute('aria-selected', 'true');
                btnBooster.setAttribute('aria-selected', 'false');
                viewCustomer.classList.add('active');
                viewBooster.classList.remove('active');
                // Focus username input if we are on login view
                if(document.getElementById('formLoginWrap').style.display !== 'none') {
                    setTimeout(() => document.getElementById('username').focus(), 250);
                    updateAuthMedia('login');
                } else {
                    setTimeout(() => document.getElementById('regUsername').focus(), 250);
                    updateAuthMedia('register');
                }
            } else {
                btnBooster.setAttribute('aria-selected', 'true');
                btnCustomer.setAttribute('aria-selected', 'false');
                viewBooster.classList.add('active');
                viewCustomer.classList.remove('active');
                
                // Clear customer passwords for security when switching
                document.getElementById('password').value = '';
                document.getElementById('regPassword').value = '';
                document.getElementById('regPasswordConfirm').value = '';
                
                updateAuthMedia('booster');
            }
        }

        // Switch Customer Form (Login <-> Register)
        function switchCustomerForm(type) {
            const loginW = document.getElementById('formLoginWrap');
            const regW = document.getElementById('formRegisterWrap');
            
            if(type === 'register') {
                loginW.style.display = 'none';
                regW.style.display = 'block';
                setTimeout(() => document.getElementById('regUsername').focus(), 50);
                updateAuthMedia('register');
            } else {
                regW.style.display = 'none';
                loginW.style.display = 'block';
                setTimeout(() => document.getElementById('username').focus(), 50);
                updateAuthMedia('login');
            }
        }

        // Toggle Password visibility
        function togglePass(inputId, btn) {
            const input = document.getElementById(inputId);
            const icon = btn.querySelector('i');
            if(input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }
        
        // Media Init
        function updateAuthMedia(state) {
            const config = window.AUTH_MEDIA_CONFIG?.authMedia;
            if(!config) return;
            const bgEl = document.getElementById('authMediaBg');
            if(bgEl.tagName === 'VIDEO') return; // Do not switch background if video is playing
            
            let url = '';
            if(state === 'booster' && config.boosterLogin) url = config.boosterLogin;
            else if(state === 'register' && config.customerRegister) url = config.customerRegister;
            else if(config.customerLogin) url = config.customerLogin;

            if(url) {
                bgEl.style.opacity = '0.5';
                setTimeout(() => {
                    bgEl.style.backgroundImage = `url('${url}')`;
                    bgEl.style.backgroundSize = 'cover';
                    bgEl.style.opacity = '1';
                }, 200);
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            const config = window.AUTH_MEDIA_CONFIG?.authMedia;
            if(!config) return;

            const bgEl = document.getElementById('authMediaBg');
            
            if(config.videoBg) {
                const vid = document.createElement('video');
                vid.src = config.videoBg;
                vid.autoplay = true; vid.muted = true; vid.loop = true; vid.playsInline = true;
                vid.className = 'auth-media-placeholder';
                vid.style.objectFit = 'cover';
                if(config.videoPoster) vid.poster = config.videoPoster;
                bgEl.replaceWith(vid);
                vid.id = 'authMediaBg';
            } else if(config.customerLogin) {
                updateAuthMedia('login');
            }

            // Generate Particles
            const particlesContainer = document.getElementById('particles');
            const isReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            if (!isReduced && particlesContainer) {
                for (let i = 0; i < 15; i++) {
                    const particle = document.createElement('div');
                    particle.classList.add('auth-particle');
                    const size = Math.random() * 4 + 1;
                    particle.style.width = size + 'px';
                    particle.style.height = size + 'px';
                    particle.style.left = Math.random() * 100 + '%';
                    particle.style.animationDuration = (Math.random() * 10 + 15) + 's';
                    particle.style.animationDelay = (Math.random() * 5) + 's';
                    particlesContainer.appendChild(particle);
                }
            }
        });
    </script>
    
    <!-- Load App Logic (contains all authentication and supabase bindings) -->
    <script src="assets/js/app.js"></script>
</body>
</html>
