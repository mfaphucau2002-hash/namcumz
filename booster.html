<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Hồ sơ và đánh giá Booster tại Namcumz.">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <title>Hồ Sơ Booster - NAMCUMZ</title>
<link rel="stylesheet" href="assets/css/design-tokens.css?v=20261004-mobile3">
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .profile-header {
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid var(--border-light);
            border-radius: 16px;
            padding: 40px;
            text-align: center;
            margin-bottom: 30px;
            position: relative;
            overflow: hidden;
        }
        .profile-header::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 100px;
            background: linear-gradient(90deg, rgba(45, 212, 191, 0.2), rgba(168, 85, 247, 0.2));
            z-index: 0;
        }
        .profile-avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid var(--bg-main);
            background: #334155;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            font-weight: 800;
            margin: 0 auto 20px;
            position: relative;
            z-index: 1;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            object-fit: cover;
        }
        .profile-name {
            font-family: 'Montserrat', sans-serif;
            font-size: 2rem;
            color: #fff;
            margin-bottom: 5px;
            position: relative;
            z-index: 1;
        }
        .profile-badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 15px;
            position: relative;
            z-index: 1;
        }
        .badge-bronze { background: rgba(205, 127, 50, 0.2); color: #cd7f32; border: 1px solid #cd7f32; }
        .badge-silver { background: rgba(192, 192, 192, 0.2); color: #c0c0c0; border: 1px solid #c0c0c0; }
        .badge-gold { background: rgba(255, 215, 0, 0.2); color: #ffd700; border: 1px solid #ffd700; }
        .badge-diamond { background: rgba(0, 255, 255, 0.2); color: #00ffff; border: 1px solid #00ffff; }
        
        .profile-bio {
            color: var(--text-muted);
            max-width: 600px;
            margin: 0 auto 20px;
            line-height: 1.6;
            position: relative;
            z-index: 1;
            font-style: italic;
        }
        .profile-stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            position: relative;
            z-index: 1;
            border-top: 1px solid rgba(255,255,255,0.05);
            padding-top: 20px;
            margin-top: 20px;
        }
        .stat-item {
            text-align: center;
        }
        .stat-value {
            font-size: 1.8rem;
            font-weight: 800;
            color: #fff;
            font-family: 'Montserrat', sans-serif;
        }
        .stat-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 5px;
        }
        .review-card {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
        }
        .review-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .reviewer-name {
            font-weight: 700;
            color: var(--accent);
        }
        .review-date {
            font-size: 0.8rem;
            color: var(--text-muted);
        }
    </style>
    <link rel="stylesheet" href="assets/css/ui.css?v=20261004-mobile3">
    <link rel="stylesheet" href="assets/css/booster.css?v=20261004-store2">
</head>
<body class="app-page booster-page">
    <nav class="navbar">
        <div class="nav-container">
            <a href="/" class="logo">
                <img src="/assets/images/logo.jpg" alt="NAMCUMZ Logo">
                NAMCUMZ
            </a>
            <div class="nav-links" id="navLinks">
                <a href="/" class="nav-link"><i class="fa-solid fa-house"></i> Trang chủ</a>
                <a href="/napgame.html" class="nav-link" style="color: #f59e0b; font-weight: 700;"><i class="fa-solid fa-bolt"></i> Nạp Game</a>
                <a href="/checkscam.html" class="nav-link"><i class="fa-solid fa-shield-virus"></i> Check Scam</a>
                <div id="authContainer">
                    <!-- Sẽ được điền bởi JS -->
                </div>
            </div>
            <button aria-label="Mở menu" aria-expanded="false" aria-controls="navLinks" class="menu-toggle" id="menuToggle"><i class="fa-solid fa-bars"></i></button>
        </div>
    </nav>

    <div class="container animate-on-load">
        <div id="profileContent">
            <div style="text-align: center; padding: 50px;">
                <i class="fa-solid fa-spinner fa-spin" style="font-size: 3rem; color: var(--accent);"></i>
                <p style="margin-top: 15px; color: var(--text-muted);">Đang tải hồ sơ...</p>
            </div>
        </div>
    </div>

    <!-- Script Supabase & App -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/runtime-config.js"></script>
    <script src="assets/js/order-api.js"></script>
    <script src="assets/js/app.js?v=20261005-notifications9"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
            const safeUrl = value => {
                try {
                    const url = new URL(String(value || ''), window.location.origin);
                    return ['http:', 'https:'].includes(url.protocol) ? esc(url.href) : '';
                } catch (_) { return ''; }
            };
            const boosterId = urlParams.get('id');
            
            if (!boosterId) {
                document.getElementById('profileContent').innerHTML = '<div class="alert text-center"><strong>Không tìm thấy thông tin Booster!</strong><p>Hồ sơ có thể không còn công khai hoặc liên kết chưa đầy đủ.</p><a class="booster-empty-link" href="/">Quay lại trang chủ ↗</a></div>';
                return;
            }

            try {
                // Fetch booster profile info
                const { data: boosterProfiles, error: infoError } = await supabaseClient.rpc('booster_profile', { p_id: boosterId });
                const boosterInfo = boosterProfiles?.[0] || null;

                if (infoError || !boosterInfo) throw new Error("Booster không tồn tại");

                // Fetch completed orders
                const { data: completedOrders, error: ordersError } = await supabaseClient.rpc('booster_reviews', { p_booster_id: boosterId });
                if (ordersError) throw ordersError;

                const orderCount = completedOrders ? completedOrders.length : 0;
                let totalRating = 0;
                let ratingCount = 0;
                let reviewsHtml = '';

                if (completedOrders) {
                    completedOrders.forEach(order => {
                        if (order.rating) {
                            totalRating += order.rating;
                            ratingCount++;
                            
                            let stars = '';
                            for(let i=1; i<=5; i++) {
                                stars += `<i class="fa-solid fa-star" style="color: ${i <= order.rating ? '#eab308' : '#334155'}; font-size: 0.9rem;"></i>`;
                            }
                            
                            reviewsHtml += `
                                <div class="review-card">
                                    <div class="review-header">
                                        <div class="reviewer-name"><i class="fa-solid fa-user"></i> ${esc(order.reviewer_name)}</div>
                                        <div class="review-date">${new Date(order.updated_at || order.created_at).toLocaleDateString('vi-VN')}</div>
                                    </div>
                                    <div style="margin-bottom: 8px;">${stars}</div>
                                    <div style="color: var(--text-main); font-size: 0.95rem;"><i>"${esc(order.review_comment || 'Không có bình luận')}"</i></div>
                                </div>
                            `;
                        }
                    });
                }

                const avgRating = ratingCount > 0 ? (totalRating / ratingCount).toFixed(1) : 0;
                
                // Calculate Rank
                let rankClass = 'badge-bronze';
                let rankIcon = '🥉';
                let rankName = 'ĐỒNG';
                
                if (orderCount >= 30) { rankClass = 'badge-diamond'; rankIcon = '💎'; rankName = 'KIM CƯƠNG'; }
                else if (orderCount >= 15) { rankClass = 'badge-gold'; rankIcon = '🥇'; rankName = 'VÀNG'; }
                else if (orderCount >= 5) { rankClass = 'badge-silver'; rankIcon = '🥈'; rankName = 'BẠC'; }

                let topBoosterBadge = (avgRating >= 4.8 && orderCount >= 5) 
                    ? `<span class="profile-badge" style="background: rgba(234, 179, 8, 0.2); color: #eab308; border: 1px solid #eab308; margin-left: 10px;"><i class="fa-solid fa-star"></i> TOP BOOSTER</span>` 
                    : '';

                const avatarSrc = safeUrl(boosterInfo.avatar_url);
                const avatarInitials = boosterInfo.username ? boosterInfo.username.substring(0, 2).toUpperCase() : 'BS';
                const avatarHtml = avatarSrc 
                    ? `<img src="${avatarSrc}" class="profile-avatar">` 
                    : `<div class="profile-avatar">${esc(avatarInitials)}</div>`;

                document.getElementById('profileContent').innerHTML = `
                    <div class="profile-header">
                        ${avatarHtml}
                        <h1 class="profile-name">${esc(boosterInfo.username)}</h1>
                        <div>
                            <span class="profile-badge ${rankClass}">${rankIcon} RANK ${rankName}</span>
                            ${topBoosterBadge}
                        </div>
                        <div class="profile-bio">${esc(boosterInfo.bio || 'Booster này chưa cập nhật tiểu sử.')}</div>
                        
                        <div class="profile-stats">
                            <div class="stat-item">
                                <div class="stat-value">${orderCount}</div>
                                <div class="stat-label">Đơn hoàn thành</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-value" style="color: #eab308;"><i class="fa-solid fa-star" style="font-size: 1.2rem;"></i> ${avgRating > 0 ? avgRating : '--'}</div>
                                <div class="stat-label">${ratingCount} Đánh giá</div>
                            </div>
                        </div>
                    </div>
                    
                    <h2 class="section-title">ĐÁNH GIÁ TỪ KHÁCH HÀNG</h2>
                    <div id="reviewsContainer">
                        ${reviewsHtml || '<div style="text-align:center; padding:30px; color:var(--text-muted);">Chưa có đánh giá nào.</div>'}
                    </div>
                `;

            } catch (err) {
                console.error(err);
                document.getElementById('profileContent').innerHTML = `<div class="alert" style="background: rgba(249, 115, 22, 0.1); color: #f97316; text-align: center;">Lỗi tải hồ sơ: ${esc(err.message)}</div>`;
            }
        });
    </script>
</body>
</html>
